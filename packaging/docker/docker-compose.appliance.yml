# docker-compose.appliance.yml — Bare Block A, the unified appliance (#1033)
#
# ONE compose stands BOTH halves of the standing box up as a single appliance on the
# Wilsch-side sandbox DGX Spark (gx10-017d):
#   - serve (run-recipe.sh): on-box vLLM (Qwen3.6-35B-A3B-NVFP4), sourced from the spark-vllm-docker recipe by box-up.sh — no longer a compose service (#1048)
#   - orchestrator   : the OpenWork worker-runtime (OpenCode subprocess inside), :8787
#   - mysql/den/web/worker-proxy : Den's login half, pulled in VANILLA from upstream's
#     own packaging via `include` below — that file is left byte-for-byte untouched, so
#     the whole Wilsch delta is only this file + .env (AC3: vanilla, no fork/patch).
#
# Design: kab-baustein-a-build-design Part 6 (The Compose) + Part 7 (The Login Path).
# Bring up (one invocation): ./box-up.sh — serve via run-recipe.sh (host :8000), then compose up the rest.
#
# Decided wires (Part 6): one shared chat engine with Den authenticating in front;
# the model wire runs DIRECT to local vLLM (OpenWork cloud inference proxy dropped);
# version-lock holds by construction — every half builds/runs from this one checkout.

include:
  - docker-compose.den-dev.yml

x-orchestrator-shared: &orchestrator-shared
  image: node:22-bookworm-slim
  working_dir: /app
  volumes:
    - ../../:/app
    - pnpm-store:/root/.local/share/pnpm/store
    - bun-install:/root/.bun
    - ${OPENWORK_WORKSPACE:-./workspace}:/workspace
    # Backend model wire (ships with the appliance, no UI): opencode imports this provider
    # config into every session — local-vLLM, direct, no cloud inference proxy.
    - ./appliance/opencode-config:/persist/.config/opencode:ro

services:
  # --- OpenWork worker-runtime: the ONE on-box worker Den points at (Part 7). AC5 wire. ---
  # Runs apps/orchestrator from the pinned source checkout (vanilla, unpatched → AC3).
  # OpenCode reads the local-vLLM provider from workspace/.opencode/opencode.json (direct wire).
  orchestrator:
    <<: *orchestrator-shared
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /workspace && touch /workspace/.keep 2>/dev/null || true
        apt-get update -qq && apt-get install -y -qq --no-install-recommends \
          curl ca-certificates unzip git >/dev/null 2>&1
        export BUN_INSTALL="/root/.bun"
        export PATH="$$BUN_INSTALL/bin:$$PATH"
        if ! command -v bun >/dev/null 2>&1; then
          echo "[orchestrator] Installing bun..."
          curl -fsSL https://bun.sh/install | bash
        fi
        corepack enable && corepack prepare pnpm@10.27.0 --activate
        echo "[orchestrator] Installing dependencies..."
        pnpm install --no-frozen-lockfile --network-concurrency 1 --child-concurrency 1
        export OPENWORK_SERVER_BIN="/app/apps/server/src/cli.ts"
        export OPENCODE_ROUTER_BIN="/app/apps/opencode-router/src/cli.ts"
        if [ -z "$$OPENWORK_TOKEN" ]; then
          OPENWORK_TOKEN=$$(cat /proc/sys/kernel/random/uuid); export OPENWORK_TOKEN
        fi
        if [ -z "$$OPENWORK_HOST_TOKEN" ]; then
          OPENWORK_HOST_TOKEN=$$(cat /proc/sys/kernel/random/uuid); export OPENWORK_HOST_TOKEN
        fi
        echo "============================================"
        echo "  OpenWork worker-runtime (appliance)"
        echo "  Worker:  http://localhost:8787  (Den points here per Part 7)"
        echo "  Token:   $$OPENWORK_TOKEN"
        echo "============================================"
        exec pnpm --filter openwork-orchestrator dev -- start \
          --workspace /workspace \
          --remote-access \
          --openwork-port 8787 \
          --openwork-token "$$OPENWORK_TOKEN" \
          --openwork-host-token "$$OPENWORK_HOST_TOKEN" \
          --openwork-server-bin "$$OPENWORK_SERVER_BIN" \
          --opencode-router-bin "$$OPENCODE_ROUTER_BIN" \
          --approval auto \
          --allow-external \
          --cors "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so OpenCode reaches vLLM on the host :8000
      # Egress seal (Refs #1043): blackhole the hosted inference domain so no session —
      # even a hand-selected cloud model — can leave the box. The on-box wire above and
      # dep-install (bun.sh, npm registry, apt) stay reachable; only opencode.ai is dead.
      - "opencode.ai:0.0.0.0"
    ports:
      - "${OPENWORK_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 180s
    environment:
      CI: "true"
      OPENWORK_TOKEN: ${OPENWORK_TOKEN:-}
      OPENWORK_HOST_TOKEN: ${OPENWORK_HOST_TOKEN:-}
      OPENWORK_DEV_MODE: ${OPENWORK_DEV_MODE:-1}
      OPENWORK_SIDECAR_SOURCE: external
      # Import the mounted opencode provider config into each worker session (the file wire above)
      OPENWORK_DEV_OPENCODE_IMPORT_CONFIG_DIR: /persist/.config/opencode

  # --- Chat SPA (@openwork/app): the MAIN OpenWork chat UI. Runs on the box; on boot the SPA's
  #     hydrateOpenworkServerSettingsFromEnv() reads VITE_OPENWORK_URL + VITE_OPENWORK_TOKEN from
  #     this container's env and connects the box worker directly — a pure browser, no connect-remote
  #     page and no clientMode fork (#1038). box-provision.sh writes those vars into appliance.env at
  #     provision time (the token is Den-minted, durable across restart via the den-mysql-data volume). ---
  chat-spa:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ../../:/app
      - spa-pnpm-store:/root/.local/share/pnpm/store
      - spa-bun-install:/root/.bun
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates unzip git >/dev/null 2>&1
        export BUN_INSTALL="/root/.bun"; export PATH="$$BUN_INSTALL/bin:$$PATH"
        command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash
        corepack enable && corepack prepare pnpm@10.27.0 --activate
        pnpm install --no-frozen-lockfile --network-concurrency 1 --child-concurrency 1
        export VITE_ALLOWED_HOSTS=all HOST=0.0.0.0 PORT=5173
        exec pnpm --filter @openwork/app exec vite --host 0.0.0.0 --port 5173 --strictPort
    environment:
      # Read by the SPA on boot via import.meta.env.VITE_* (openwork-server.ts hydrate). Vite gives
      # already-set process-env the highest priority, so these reach the client bundle when present
      # before `exec vite` above — no in-SPA .env file, no source fork (AC1/AC2, config-only). Empty
      # until box-provision.sh writes the Den-minted client token + Tailscale worker URL to appliance.env.
      VITE_OPENWORK_URL: ${VITE_OPENWORK_URL:-}
      VITE_OPENWORK_TOKEN: ${VITE_OPENWORK_TOKEN:-}
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 72
      start_period: 300s

volumes:
  spa-pnpm-store:
    name: openwork-appliance-spa-pnpm-store
  spa-bun-install:
    name: openwork-appliance-spa-bun-install
  pnpm-store:
    name: openwork-appliance-pnpm-store
  bun-install:
    name: openwork-appliance-bun-install
